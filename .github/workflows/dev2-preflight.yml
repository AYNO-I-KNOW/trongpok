{
  "name": "Dev 2 preflight",
  "on": {
    "push": {
      "branches": [
        "codex/dev2-preflight-20261121"
      ],
      "paths": [
        ".github/workflows/dev2-preflight.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "dev2-preflight",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "env": {
        "CI": "true",
        "NEXT_TELEMETRY_DISABLED": "1",
        "OPENAI_API_KEY": "",
        "OPENAI_MODEL": ""
      },
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "07b2d4bcc357713ecff575a2d7a708393613f602"
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.9.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Apply and verify the staged patch",
          "env": {
            "PATCH_BLOB": "2be6f2f4bd475cda300a25d53a1a006cdcbb7d24",
            "PATCH_SHA256": "340d6e51aec612d5aaabff0381de00ba3734f30dd808911fedf836a67a749618",
            "EXPECTED_TREE": "9ff3aff9a1a0499c30964479fdd3f2520ec8d7d2",
            "REPOSITORY": "${{ github.repository }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "node --input-type=module <<'NODE'\nimport { createHash } from \"node:crypto\";\nimport { writeFileSync } from \"node:fs\";\nimport { join } from \"node:path\";\nimport { execFileSync } from \"node:child_process\";\nif (!/^[a-f0-9]{40}$/.test(process.env.PATCH_BLOB)) throw new Error(\"Invalid patch blob\");\nconst response = await fetch(\"https://api.github.com/repos/\" + process.env.REPOSITORY + \"/git/blobs/\" + process.env.PATCH_BLOB, {\n  headers: { Authorization: \"Bearer \" + process.env.GITHUB_TOKEN, Accept: \"application/vnd.github+json\" }\n});\nif (!response.ok) throw new Error(\"Patch download failed: \" + response.status);\nconst blob = await response.json();\nif (blob.encoding !== \"base64\") throw new Error(\"Unexpected blob encoding\");\nconst patch = Buffer.from(blob.content, \"base64\");\nif (createHash(\"sha256\").update(patch).digest(\"hex\") !== process.env.PATCH_SHA256) throw new Error(\"Patch hash mismatch\");\nconst patchPath = join(process.env.RUNNER_TEMP, \"dev2-preflight.patch\");\nwriteFileSync(patchPath, patch);\nexecFileSync(\"git\", [\"apply\", \"--index\", patchPath], { stdio: \"inherit\" });\nconst tree = execFileSync(\"git\", [\"write-tree\"], { encoding: \"utf8\" }).trim();\nif (tree !== process.env.EXPECTED_TREE) throw new Error(\"The applied source tree differs: \" + tree);\nconsole.log(\"Validated source tree: \" + tree);\nNODE"
        },
        {
          "name": "Install locked dependencies",
          "id": "install",
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Unit tests",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "npm test"
        },
        {
          "name": "UI and rules integration tests",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "npm run test:ui"
        },
        {
          "name": "Publisher checks",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "npm run test:publish"
        },
        {
          "name": "Lint",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "npm run lint"
        },
        {
          "name": "Production build",
          "id": "build",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "npm run build"
        },
        {
          "name": "TypeScript diagnostics",
          "if": "${{ !cancelled() && steps.build.outcome == 'failure' }}",
          "run": "npm exec -- tsc --noEmit --pretty false"
        },
        {
          "name": "Install browser verification tools",
          "if": "${{ !cancelled() && steps.build.outcome == 'success' }}",
          "run": "npm install --prefix \"$RUNNER_TEMP/dev2-browser\" --no-package-lock --ignore-scripts playwright@1.65.1\n\"$RUNNER_TEMP/dev2-browser/node_modules/.bin/playwright\" install --with-deps chromium",
          "id": "browser_tools"
        },
        {
          "name": "Production browser smoke",
          "if": "${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_tools.outcome == 'success' }}",
          "env": {
            "PLAYWRIGHT_ROOT": "${{ runner.temp }}/dev2-browser"
          },
          "run": "node scripts/dev2-browser.check.mjs"
        }
      ]
    }
  }
}
